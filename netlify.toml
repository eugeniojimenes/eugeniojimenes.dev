[build]
  command = "npm run build:prod"
  publish = "src/_site"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "10"
  RUBY_VERSION = "3.4.9"
  JEKYLL_ENV = "production"
  NODE_ENV = "production"

[[redirects]]
  from = "https://callmarx.dev/*"
  to = "https://eugeniojimenes.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.callmarx.dev/*"
  to = "https://eugeniojimenes.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301
  force = true
