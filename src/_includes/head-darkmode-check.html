<!-- This must be placed inside the head tag before the body tag to avoid FOUC (flash of unstyled content) when changing pages or themes -->
<script>
  // Default theme is dark (terminal aesthetic). Only opt-out is an explicit
  // 'light' choice persisted to localStorage by the dark-mode controller.
  if (localStorage.theme === 'light') {
    document.documentElement.classList.remove('dark')
  } else {
    document.documentElement.classList.add('dark')
  }
</script>
