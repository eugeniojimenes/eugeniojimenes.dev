title: "EugenioJimenes.dev"
tagline: "Senior Software Developer · Rails since 2012"
description: "Notes on Rails, Ruby, Hotwire and the developer's classic battle of managing expectations, focus and frustration."
url: "https://eugeniojimenes.dev"
author: "Eugenio A. Jimenes"
image: "/assets/images/eu.webp"
language: "en"
baseurl: ""

google_analytics: G-M04ER887TV

facebook:
  app_id: 723752958736659

markdown: kramdown
highlighter: rouge
excerpt_separator: <!-- excerpt-end -->
word_count: 160

plugins:
  - jekyll-paginate-v2
  - jekyll-seo-tag
  - jekyll-sitemap

postcss:
  cache: false


pagination:
  enabled: true
  per_page: 4
  sort_reverse: true #for descending order by date
  permalink: "/page/:num/"
  trail:
    before: 2
    after: 2

defaults:
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post

include:
  - _pages
